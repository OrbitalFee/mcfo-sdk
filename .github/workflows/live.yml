name: Live API

# The live suite against the real Orbital Fee API, once a day and on demand.
# A red run here means the API changed or is down, not that this commit broke.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The API sits behind Cloudflare Access (2026-10-15): the service token
      # lets this job through. Repo secrets; unset = anonymous (will be refused).
      - run: npm run test:live
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Examples against the live API
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node examples/quick-fees.mjs
          node examples/dry-run-transaction.mjs
