name: Release

# Stages a release on npm when a version tag (v1.2.3) is pushed. The tag must
# equal package.json "version", or the job fails before anything is staged.
#
# No npm token: npm Trusted Publishing authenticates this workflow through
# GitHub's OIDC token (id-token: write) and adds provenance by itself. The
# trust relationship (OrbitalFee/mcfo-sdk, release.yml) allows STAGED
# publishing only, so CI never makes a version public on its own: a
# maintainer approves each staged version with 2FA (npm stage approve, or the
# package page on npmjs.com). Needs npm 11.21 or later for `npm stage`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # npm Trusted Publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: npm 11.21 or later (Trusted Publishing, staged publishing)
        run: npm install -g npm@^11.21.0 && npm --version
      - name: Tag matches package.json version
        run: |
          want="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version ($want)"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Stage the release (a maintainer approves it with 2FA)
        # Verbose so a refused Trusted Publishing exchange says why in the log
        # (otherwise npm falls back to the placeholder token and prints a 404).
        run: npm stage publish --access public --loglevel verbose
      - name: How to approve
        run: |
          {
            echo "### Staged $GITHUB_REF_NAME on npm, waiting for approval"
            echo
            echo "Approve with 2FA (npm 11.21 or later):"
            echo
            echo '```'
            echo 'npm stage list @orbitalfee/mcfo-sdk'
            echo 'npm stage approve <stage-id>'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
