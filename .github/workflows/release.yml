name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed. The tag must equal
# package.json "version", or the job fails before anything is published.
# No npm token: npm Trusted Publishing authenticates this workflow through
# GitHub's OIDC token (id-token: write) and adds provenance by itself.
# It needs npm 11.5.1 or later, and the package's npm settings must name
# OrbitalFee/mcfo-sdk and release.yml as its trusted publisher.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # npm Trusted Publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: npm 11.5.1 or later (Trusted Publishing)
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Tag matches package.json version
        run: |
          want="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version ($want)"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Publish
        # Verbose so a refused Trusted Publishing exchange says why in the log
        # (otherwise npm falls back to the placeholder token and prints a 404).
        run: npm publish --access public --loglevel verbose
