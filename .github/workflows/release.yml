name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed. The tag must equal
# package.json "version", or the job fails before anything is published.
# The npm token lives only in the NPM_TOKEN repository secret.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Tag matches package.json version
        run: |
          want="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version ($want)"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
